# GreenLedger — Phase A infrastructure.
# Postgres 16 with the Section 1.2 schema applied on first init: deferred
# balance-check trigger, period-lock trigger, revoked UPDATE/DELETE on the
# journal tables, the per-org hash chain, and the role grants that make the AI
# a proposals-only writer.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greenledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenledger}
      POSTGRES_DB: greenledger
      GREENLEDGER_APP_PASSWORD: ${GREENLEDGER_APP_PASSWORD:-app_secret}
      GREENLEDGER_AI_PASSWORD: ${GREENLEDGER_AI_PASSWORD:-ai_secret}
    ports:
      - "${GREENLEDGER_DB_PORT:-5432}:5432"
    volumes:
      - ./db/sql:/greenledger-db/sql:ro
      - ./db/apply.sh:/greenledger-db/apply.sh:ro
      - ./db/docker-initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenledger -d greenledger"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Service layer connects as the append-only app role, never as superuser.
      GREENLEDGER_DATABASE_URL: postgresql://greenledger_app:${GREENLEDGER_APP_PASSWORD:-app_secret}@db:5432/greenledger
      GREENLEDGER_AI_URL: postgresql://greenledger_ai:${GREENLEDGER_AI_PASSWORD:-ai_secret}@db:5432/greenledger
    ports:
      - "${GREENLEDGER_API_PORT:-8000}:8000"

volumes:
  pgdata: {}
